<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WalkProof preview frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        min-height: 900px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <iframe id="app" title="WalkProof preview"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const width = Math.max(320, Math.min(1920, Number(params.get("w")) || 1440));
      const frame = document.getElementById("app");
      frame.style.width = width + "px";
      frame.src = "./index.html" + location.hash;

      function fit() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight, 900);
          frame.style.height = height + "px";
          window.WALKPROOF_FRAME = { width, height, scrollWidth: doc.documentElement.scrollWidth, clientWidth: doc.documentElement.clientWidth };
        } catch (error) {
          window.WALKPROOF_FRAME = { error: String(error) };
        }
      }

      window.fitWalkProof = fit;
      frame.addEventListener("load", () => {
        fit();
        setInterval(fit, 400);
      });
    </script>
  </body>
</html>
